# 三平台 CI（0.12.0 起）：同一份代码在 ubuntu / windows / macos 上都要过
#   typecheck（tsc --noEmit，类型面在 types/dsh-externals.d.ts 里）→ build → 全量测试。
#
# 为什么三平台都要跑：本插件有相当一部分行为与平台相关（默认终端探测、bash 反推、
# 路径分隔符、重启助手的进程模型），只在 Windows 上验过的代码等于只验了一半。
#
# 为什么先 build 再 test：测试打的是**构建产物** `lib/index.js` / `lib/client.js`
# （与用户实际加载的那份一致）；不重建就会拿旧产物测新源码 —— 那是假绿。
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖（npm ci：lockfile 锁定，可复现）
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npm run typecheck
      - name: 构建
        run: npm run build
      - name: 全量测试（18 套件）
        # 用 bash 跑（三个平台都有）：失败时把关键行用 `::error::` 发成**注解**，
        # 这样远程（没有 admin 权限下不到 job log）也能从 check-run 的 annotations 里读到原因。
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 直接打**日志末尾**（不过滤）：筛过一次发现失败时的关键行恰好不匹配关键字，
            # 而漏掉的恰恰是最需要的那几行。
            # 只发 8 行：GitHub 对每个 check run 的**注解有上限**（约 10 条），发 40 行反而只能看到前 10 行。
            tail -8 test-output.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
